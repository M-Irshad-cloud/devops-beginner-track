replicaCount: 2

image:
  repository: ghcr.io/m-irshad-cloud/devops-beginner-track
  tag: sha-22e54d6
  pullPolicy: IfNotPresent

containerPort: 5000

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50
  scaleDownStabilizationSeconds: 60
