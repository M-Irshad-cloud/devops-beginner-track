services:
  app:
    build: .
    environment:
      - ENABLE_FAULTS=1
    expose:
      - "5000"
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - app
      - alertmanager
    networks:
      - appnet

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - webhook
    networks:
      - appnet

  webhook:
    image: python:3.12-slim
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./alerting/receiver.py:/app/receiver.py:ro
    networks:
      - appnet

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - appnet

networks:
  appnet:

volumes:
  grafana-data:
